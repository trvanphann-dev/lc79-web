<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>LC79 Auto - Hệ thống đa người dùng</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#060912;--s1:#0e1424;--s2:#131b30;--line:rgba(140,165,215,.14);--line2:rgba(140,165,215,.28);
  --text:#edf2fb;--mut:#8394b0;--blue:#5b8cff;--blue2:#3a68f5;--green:#27d9a5;--red:#ff5d6e;--gold:#ffc24b;
  --ease:cubic-bezier(.22,.8,.3,1);
}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.55 "Inter","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--text);background:var(--bg);min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-appearance:none;appearance:none}
.hidden{display:none!important}

/* ===== Nền ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.bg i:nth-child(1){width:480px;height:480px;left:-160px;top:-140px;background:#2447d8;opacity:.5;animation:d1 24s ease-in-out infinite alternate}
.bg i:nth-child(2){width:420px;height:420px;right:-140px;bottom:-120px;background:#0c9e7a;opacity:.32;animation:d2 28s ease-in-out infinite alternate}
.bg b{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:44px 44px;opacity:.3;-webkit-mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%);mask-image:radial-gradient(ellipse at 50% 25%,#000 5%,transparent 70%)}
@keyframes d1{to{transform:translate3d(110px,80px,0)}}
@keyframes d2{to{transform:translate3d(-100px,-70px,0)}}

.wrap{position:relative;z-index:1;width:min(900px,100%);margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 14px calc(34px + env(safe-area-inset-bottom))}
.view{animation:vin .5s var(--ease) both}
@keyframes vin{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ===== Thành phần chung ===== */
.logo{position:relative;width:54px;height:54px;border-radius:16px;flex:none;display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--blue);background:#0b1120}
.logo::before{content:"";position:absolute;inset:-2px;border-radius:18px;background:conic-gradient(from 0deg,var(--blue),var(--green),var(--gold),var(--blue));animation:spin 6s linear infinite;z-index:-1}
.logo::after{content:"";position:absolute;inset:0;border-radius:16px;background:#0b1120;z-index:-1}
.logo img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
h1{font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h2{font-size:15.5px;font-weight:700}
.sub{font-size:12.5px;color:var(--mut)}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.panel{background:linear-gradient(180deg,var(--s2),var(--s1));border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;box-shadow:0 18px 40px -22px #000,inset 0 1px 0 rgba(255,255,255,.05)}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line2);background:rgba(255,255,255,.05);font-weight:600;font-size:14px;transition:transform .15s var(--ease),filter .2s,background .2s;user-select:none;-webkit-user-select:none}
.btn:hover{background:rgba(255,255,255,.09)}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn:focus-visible,.inp:focus-visible,.seg button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.p{background:linear-gradient(135deg,var(--blue2),var(--blue));border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px rgba(91,140,255,.9)}
.btn.g{background:linear-gradient(135deg,#0fa97d,var(--green));border-color:transparent;color:#04251c;box-shadow:0 10px 24px -10px rgba(39,217,165,.7)}
.btn.d{background:linear-gradient(135deg,#e13a4d,var(--red));border-color:transparent;color:#fff;box-shadow:0 10px 24px -10px rgba(255,93,110,.7)}
.btn.p:hover,.btn.g:hover,.btn.d:hover{filter:brightness(1.1)}
.btn.sm{min-height:36px;padding:0 13px;font-size:13px;border-radius:10px}
.btn.full{width:100%}
.btn.busy{pointer-events:none;opacity:.8}
.btn.busy::after{content:"";width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite}

.lbl{display:block;font-size:13px;font-weight:600;color:var(--mut);margin-bottom:8px}
.inp{width:100%;min-height:46px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:#070b16;font-size:16px;outline:none;transition:border-color .2s,box-shadow .2s}
.inp::placeholder{color:#506178}
.inp:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(91,140,255,.16)}

/* ===== Đăng nhập ===== */
.login{max-width:410px;margin:8vh auto 0;padding:26px}
.seg{position:relative;display:grid;grid-template-columns:1fr 1fr;margin:22px 0 18px;padding:4px;border-radius:14px;background:#070b16;border:1px solid var(--line)}
.seg .th{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--blue));box-shadow:0 8px 18px -8px rgba(91,140,255,.9);transition:transform .35s var(--ease);pointer-events:none}
.seg[data-t="admin"] .th{transform:translateX(100%)}
.seg button{position:relative;z-index:2;min-height:42px;border:0;background:none;border-radius:10px;font-weight:700;font-size:14px;color:var(--mut);transition:color .25s}
.seg button.on{color:#fff}
.form{display:grid;gap:16px;animation:fin .3s var(--ease) both}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}

/* ===== Header trang trong ===== */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}
.chip{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:3px 10px;margin-top:3px;border-radius:20px;background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.25);color:#a9c1ff;font:600 12px ui-monospace,Menlo,Consolas,monospace}

/* ===== Thẻ thống kê ===== */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
.stat{position:relative;padding:16px 18px;border-radius:18px;border:1px solid var(--line);background:linear-gradient(180deg,var(--s2),var(--s1));overflow:hidden;box-shadow:0 18px 40px -26px #000}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:var(--ac,var(--blue));opacity:.14;filter:blur(18px);transition:background .4s}
.stat .k{font-size:12.5px;font-weight:600;color:var(--mut)}
.stat .v{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:21px;font-weight:800;min-height:32px;word-break:break-all;font-variant-numeric:tabular-nums}
.dot{position:relative;width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.dot.live::after{content:"";position:absolute;inset:0;border-radius:50%;background:var(--c);animation:ping 1.6s ease-out infinite}
@keyframes ping{from{transform:scale(1);opacity:.75}to{transform:scale(3.2);opacity:0}}
.on{color:var(--green)}.off{color:var(--red)}

/* ===== Tài khoản ===== */
.acc{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:14px;border-radius:14px;background:rgba(255,255,255,.03);border:1px solid var(--line);animation:fin .35s var(--ease) both}
.acc-l{display:flex;align-items:center;gap:12px;min-width:0}
.av{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:18px;background:linear-gradient(135deg,#1f3a9c,var(--blue2));flex:none}
.an{font-weight:800;word-break:break-all}
.as{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600}
.ab{display:flex;gap:8px}
.add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}
.hint{font-size:12.5px;color:var(--mut);margin-top:10px}

/* ===== Nhật ký ===== */
.term{border:1px solid var(--line);border-radius:14px;background:#04070e;overflow:hidden}
.term-h{display:flex;align-items:center;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:#080d19}
.term-h i{width:9px;height:9px;border-radius:50%;background:#ff5f57}
.term-h i:nth-child(2){background:#febc2e}.term-h i:nth-child(3){background:#28c840}
.term-h span{margin-left:auto;font-size:11.5px;color:var(--mut)}
.log{height:300px;overflow-y:auto;padding:10px 12px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#93a4bd;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#26354f transparent}
.log div{padding-left:10px;border-left:2px solid var(--blue);color:#7fb0ff;word-break:break-word}
.log div.ok{color:#52e6b8;border-color:var(--green)}
.log div.fail{color:#ff8f9b;border-color:var(--red)}
.log p{color:var(--mut)}

/* ===== Admin ===== */
.key{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 4px;border-bottom:1px solid var(--line);animation:fin .3s var(--ease) both}
.key:last-child{border:0}
.kc{font:700 16px ui-monospace,Menlo,Consolas,monospace;color:var(--blue);letter-spacing:.02em;word-break:break-all;background:none;border:0;text-align:left;padding:0}
.km{font-size:12px;color:var(--mut);margin-top:2px}
.pill{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:20px;font:700 11px system-ui;background:rgba(39,217,165,.14);color:var(--green);vertical-align:middle}
.empty{text-align:center;color:var(--mut);padding:30px 10px}

/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:99;max-width:92vw;padding:12px 20px;border-radius:14px;background:#17223b;border:1px solid var(--line2);font-weight:600;font-size:14px;text-align:center;box-shadow:0 20px 44px rgba(0,0,0,.6);opacity:0;transform:translate(-50%,24px);pointer-events:none;transition:opacity .3s,transform .35s var(--ease)}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media(max-width:560px){
  .login{margin-top:4vh;padding:20px}
  .panel{padding:16px}
  .stat .v{font-size:18px}
  .add{grid-template-columns:1fr}
  .ab{width:100%}.ab .btn{flex:1}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><b></b></div>

<!-- VIEW 1: LOGIN -->
<div class="wrap hidden" id="loginView">
  <div class="panel login" id="loginCard">
    <div class="brand">
      <div class="logo"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp" alt="" data-fallback></div>
      <div><h1>LC79 Auto</h1><div class="sub">Hệ thống Đa người dùng</div></div>
    </div>

    <div class="seg" id="seg" data-t="user">
      <div class="th"></div>
      <button type="button" class="on" id="tabUser" data-act="tab" data-tab="user">Người Dùng</button>
      <button type="button" id="tabAdmin" data-act="tab" data-tab="admin">Admin</button>
    </div>

    <div class="form" id="formUser">
      <div>
        <label class="lbl" for="inpKey">Nhập Key của bạn</label>
        <input class="inp" id="inpKey" placeholder="VD: LC79-A1B2C3" autocomplete="off" autocapitalize="characters" spellcheck="false">
      </div>
      <button type="button" class="btn p full" id="btnLoginUser" data-act="loginUser">Đăng nhập bằng Key</button>
    </div>

    <div class="form hidden" id="formAdmin">
      <div>
        <label class="lbl" for="inpAdminPass">Mật khẩu Admin</label>
        <input class="inp" id="inpAdminPass" type="password" placeholder="Nhập mật khẩu tạo Key" autocomplete="current-password">
      </div>
      <button type="button" class="btn p full" id="btnLoginAdmin" data-act="loginAdmin">Vào trang Quản trị</button>
    </div>
  </div>
</div>

<!-- VIEW 2: GIAO DIỆN USER -->
<div class="wrap hidden" id="userView">
  <div class="top">
    <div class="brand">
      <div class="logo"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp" alt="" data-fallback></div>
      <div style="min-width:0"><h1>Bảng điều khiển</h1><div class="chip ell" id="txtUserKey">Key: ...</div></div>
    </div>
    <button type="button" class="btn d sm" data-act="logout">Đăng xuất</button>
  </div>

  <div class="stats">
    <div class="stat" id="cardActive"><div class="k">Trạng thái Tool</div><div class="v" id="userActive">Đang tải...</div></div>
    <div class="stat" style="--ac:var(--gold)"><div class="k">Code mới nhất</div><div class="v" id="userCode">—</div></div>
  </div>

  <div class="panel">
    <div class="ph"><h2>Quản lý Tài khoản</h2><span class="sub">Tối đa 1 acc</span></div>
    <div id="accContainer"></div>
    <div id="formAddAcc" class="hidden">
      <div class="add">
        <input class="inp" id="accU" placeholder="Tên đăng nhập" autocomplete="off">
        <input class="inp" id="accP" type="password" placeholder="Mật khẩu" autocomplete="off">
        <button type="button" class="btn p" id="btnAddAcc" data-act="addAcc">Lưu &amp; Đăng nhập</button>
      </div>
      <div class="hint">* Mỗi Key chỉ được treo 1 acc duy nhất để đảm bảo tốc độ.</div>
    </div>
  </div>

  <div class="panel">
    <div class="ph"><h2>Nhật ký đổi mã</h2></div>
    <div class="term">
      <div class="term-h"><i></i><i></i><i></i><span id="logCount">0 dòng</span></div>
      <div class="log" id="userLogs"><p>Chưa có log...</p></div>
    </div>
  </div>
</div>

<!-- VIEW 3: GIAO DIỆN ADMIN -->
<div class="wrap hidden" id="adminView">
  <div class="top">
    <div class="brand">
      <div class="logo"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp" alt="" data-fallback></div>
      <div><h1>Trang Quản Trị</h1><div class="sub">Quản lý Key người dùng</div></div>
    </div>
    <button type="button" class="btn d sm" data-act="logout">Đăng xuất</button>
  </div>

  <div class="panel">
    <div class="ph"><h2>Danh sách Key</h2><button type="button" class="btn g sm" id="btnCreateKey" data-act="createKey">+ Tạo Key mới</button></div>
    <div id="adminKeyList"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
var $ = function (id) { return document.getElementById(id); };
var myKey = localStorage.getItem('lc79_key') || '';
var isAdmin = false;
var refreshTimer = null;
var refreshGen = 0;
var toastTimer = null;
var lastSig = {};

/* ---------- Tiện ích giao diện ---------- */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function setHTML(el, key, html) {
  if (lastSig[key] === html) return false;
  lastSig[key] = html;
  el.innerHTML = html;
  return true;
}
function setText(el, v) { if (el.textContent !== v) el.textContent = v; }

function toast(msg) {
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2800);
}

async function withBusy(btn, fn) {
  if (btn) {
    if (btn.classList.contains('busy')) return;
    btn.classList.add('busy'); btn.disabled = true;
  }
  try { return await fn(); }
  finally { if (btn) { btn.classList.remove('busy'); btn.disabled = false; } }
}

function restartAnim(el, cls) { el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }
function shakeLogin() { restartAnim($('loginCard'), 'shake'); }

/* ---------- Chuyển tab đăng nhập ---------- */
function switchTab(type) {
  var user = type === 'user';
  $('seg').setAttribute('data-t', type);
  $('tabUser').classList.toggle('on', user);
  $('tabAdmin').classList.toggle('on', !user);
  $('formUser').classList.toggle('hidden', !user);
  $('formAdmin').classList.toggle('hidden', user);
  restartAnim(user ? $('formUser') : $('formAdmin'), 'form');
}

/* ---------- API CALL ---------- */
async function api(url, method, body) {
  method = method || 'GET';
  var headers = { 'x-api-key': isAdmin ? 'ADMIN' : myKey };
  if (body) headers['Content-Type'] = 'application/json';
  var r = await fetch(url, { method: method, headers: headers, body: body ? JSON.stringify(body) : null });
  var j = await r.json().catch(function () { return { ok: false, error: 'Lỗi Server' }; });
  if (!r.ok || !j.ok) throw new Error(j.error || 'Lỗi');
  return j;
}

/* ---------- ĐĂNG NHẬP ---------- */
async function loginUser() {
  var k = $('inpKey').value.trim().toUpperCase();
  if (!k) { shakeLogin(); return toast('Nhập Key trước!'); }
  myKey = k;
  await withBusy($('btnLoginUser'), async function () {
    try {
      await api('/api/user/state');
      localStorage.setItem('lc79_key', myKey); // Lưu lại để F5 không mất
      showView('userView');
      startRefresh(2000, refreshUser);
    } catch (e) {
      myKey = '';
      localStorage.removeItem('lc79_key');
      shakeLogin();
      toast('Key không hợp lệ!');
    }
  });
}

async function loginAdmin() {
  var p = $('inpAdminPass').value.trim();
  if (!p) { shakeLogin(); return toast('Nhập mật khẩu Admin!'); }
  await withBusy($('btnLoginAdmin'), async function () {
    try {
      var res = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: p }) });
      if (!res.ok) throw new Error('Sai mật khẩu');
      isAdmin = true;
      showView('adminView');
      loadAdminKeys();
    } catch (e) {
      shakeLogin();
      toast('Sai mật khẩu Admin!');
    }
  });
}

function logout() {
  myKey = ''; isAdmin = false;
  localStorage.removeItem('lc79_key'); // Xóa key khi đăng xuất
  refreshGen++;
  clearTimeout(refreshTimer);
  lastSig = {};
  $('inpKey').value = ''; $('inpAdminPass').value = '';
  showView('loginView');
}

function showView(viewId) {
  ['loginView', 'userView', 'adminView'].forEach(function (id) { $(id).classList.add('hidden'); });
  var v = $(viewId);
  v.classList.remove('hidden');
  restartAnim(v, 'view');
}

function startRefresh(ms, fn) {
  clearTimeout(refreshTimer);
  var gen = ++refreshGen;
  var tick = async function () {
    if (gen !== refreshGen) return;
    if (!document.hidden) await fn(gen);
    if (gen !== refreshGen) return;
    refreshTimer = setTimeout(tick, ms);
  };
  tick();
}
document.addEventListener('visibilitychange', function () {
  if (!document.hidden && myKey && !isAdmin) startRefresh(2000, refreshUser);
});

/* ---------- DÀNH CHO USER ---------- */
async function refreshUser(gen) {
  try {
    var res = await api('/api/user/state');
    if (gen !== refreshGen) return;
    var s = res.state;
    
    // Vì server tự động chạy ngầm nên trạng thái luôn là ĐANG BẬT nếu có acc
    var on = s.active;

    setText($('txtUserKey'), 'Key: ' + myKey);
    setHTML($('userActive'), 'active',
      '<span class="dot ' + (on ? 'live' : '') + '" style="--c:' + (on ? 'var(--green)' : 'var(--red)') + '"></span>' +
      '<span class="' + (on ? 'on' : 'off') + '">' + (on ? 'ĐANG BẬT' : 'ĐANG TẮT') + '</span>');
    $('cardActive').style.setProperty('--ac', on ? 'var(--green)' : 'var(--red)');
    setText($('userCode'), s.lastCode || '—');

    if (s.account) {
      var a = s.account;
      var col = a.loggedIn ? 'var(--green)' : 'var(--red)';
      $('formAddAcc').classList.add('hidden');
      setHTML($('accContainer'), 'acc',
        '<div class="acc">' +
          '<div class="acc-l">' +
            '<div class="av">' + esc((a.username || '?').charAt(0).toUpperCase()) + '</div>' +
            '<div>' +
              '<div class="an">' + esc(a.username) + '</div>' +
              '<div class="as" style="color:' + col + '"><span class="dot ' + (a.loggedIn ? 'live' : '') + '" style="--c:' + col + ';width:7px;height:7px"></span>' +
                (a.loggedIn ? 'Đã đăng nhập' : esc(a.error || 'Lỗi kết nối')) + '</div>' +
            '</div>' +
          '</div>' +
          '<div class="ab">' +
            '<button type="button" class="btn d" data-act="delAcc">Xóa Acc</button>' +
          '</div>' +
        '</div>');
    } else {
      setHTML($('accContainer'), 'acc', '');
      $('formAddAcc').classList.remove('hidden');
    }

    var logs = Array.isArray(s.logs) ? s.logs : [];
    var html = logs.map(function (l) {
      var cls = l.indexOf('[OK]') > -1 ? 'ok' : (l.indexOf('[FAIL]') > -1 ? 'fail' : '');
      return '<div class="' + cls + '">' + esc(l) + '</div>';
    }).join('') || '<p>Chưa có log...</p>';
    var box = $('userLogs');
    var near = box.scrollHeight - box.scrollTop - box.clientHeight < 40;
    var top = box.scrollTop;
    if (setHTML(box, 'logs', html)) box.scrollTop = near ? box.scrollHeight : top;
    setText($('logCount'), logs.length + ' dòng');
  } catch (e) { console.log(e); }
}

async function addAcc() {
  var u = $('accU').value.trim();
  var p = $('accP').value.trim();
  if (!u || !p) return toast('Nhập đủ Tài khoản và Mật khẩu!');
  await withBusy($('btnAddAcc'), async function () {
    try {
      toast('Đang kiểm tra đăng nhập...');
      await api('/api/user/account', 'POST', { username: u, password: p });
      $('accU').value = ''; $('accP').value = '';
      await refreshUser(refreshGen);
    } catch (e) { toast(e.message); }
  });
}

async function delAcc(btn) {
  if (!confirm('Xóa tài khoản này?')) return;
  await withBusy(btn, async function () {
    try {
      await api('/api/user/account', 'DELETE');
      await refreshUser(refreshGen);
    } catch (e) { toast(e.message); }
  });
}

/* ---------- DÀNH CHO ADMIN ---------- */
async function loadAdminKeys() {
  try {
    var res = await api('/api/admin/keys');
    var keys = res.keys || [];
    var html = keys.length === 0
      ? '<div class="empty">Chưa có key nào. Bấm “Tạo Key mới” để bắt đầu.</div>'
      : keys.map(function (k) {
          return '<div class="key">' +
            '<div style="min-width:0">' +
              '<button type="button" class="kc" data-act="copyKey" data-k="' + esc(k.key) + '" title="Bấm để sao chép">' + esc(k.key) + '</button>' +
              (k.active ? '<span class="pill">Đang bật</span>' : '') +
              '<div class="km">' + (k.hasAcc ? 'Acc: ' + esc(k.username) : 'Chưa gắn tài khoản') + '</div>' +
            '</div>' +
            '<button type="button" class="btn d sm" data-act="delKey" data-k="' + esc(k.key) + '">Xóa</button>' +
          '</div>';
        }).join('');
    setHTML($('adminKeyList'), 'keys', html);
  } catch (e) { toast(e.message); }
}

async function createKey() {
  await withBusy($('btnCreateKey'), async function () {
    try {
      var res = await api('/api/admin/keys', 'POST');
      toast('Đã tạo Key: ' + res.key);
      await loadAdminKeys();
    } catch (e) { toast(e.message); }
  });
}

async function delKey(k, btn) {
  if (!confirm('Xóa Key ' + k + '?')) return;
  await withBusy(btn, async function () {
    try {
      await api('/api/admin/keys/' + encodeURIComponent(k), 'DELETE');
      await loadAdminKeys();
    } catch (e) { toast(e.message); }
  });
}

function copyKey(k) {
  var done = function () { toast('Đã sao chép: ' + k); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(k).then(done, function () { toast(k); });
  } else toast(k);
}

/* ---------- Sự kiện ---------- */
document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  var act = el.getAttribute('data-act');
  var k = el.getAttribute('data-k');
  if (act === 'tab') switchTab(el.getAttribute('data-tab'));
  else if (act === 'loginUser') loginUser();
  else if (act === 'loginAdmin') loginAdmin();
  else if (act === 'logout') logout();
  else if (act === 'addAcc') addAcc();
  else if (act === 'delAcc') delAcc(el);
  else if (act === 'createKey') createKey();
  else if (act === 'delKey') delKey(k, el);
  else if (act === 'copyKey') copyKey(k);
});

document.addEventListener('keydown', function (e) {
  if (e.key !== 'Enter') return;
  var id = document.activeElement && document.activeElement.id;
  if (id === 'inpKey') loginUser();
  else if (id === 'inpAdminPass') loginAdmin();
  else if (id === 'accU' || id === 'accP') addAcc();
});

document.querySelectorAll('img[data-fallback]').forEach(function (img) {
  img.addEventListener('error', function () { img.replaceWith(document.createTextNode('79')); });
});
window.addEventListener('error', function (e) { toast('Lỗi: ' + (e.message || 'không xác định')); });

/* ---------- KHỞI ĐỘNG TỰ ĐỘNG ĐĂNG NHẬP ---------- */
async function init() {
  if (myKey) {
    // Thử đăng nhập ngầm bằng Key đã lưu
    try {
      await api('/api/user/state');
      showView('userView');
      startRefresh(2000, refreshUser);
    } catch (e) {
      // Key cũ bị xoá hoặc sai -> Bắt đăng nhập lại
      myKey = '';
      localStorage.removeItem('lc79_key');
      showView('loginView');
    }
  } else {
    showView('loginView');
  }
}
init();
</script>
