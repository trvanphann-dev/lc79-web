<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0f1c">
<title>LC79 Auto - Hệ thống đa người dùng</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg-0:#060910; --panel:rgba(18,26,42,.75); --line:rgba(120,150,200,.12);
  --text:#f0f4f8; --muted:#8a9eb5; --blue:#3b82f6; --green:#10b981; --red:#ef4444;
  --radius:16px;
}
html,body{height:100%}
body{font:15px/1.55 "Inter",system-ui,sans-serif;color:var(--text);background:var(--bg-0);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(circle at 15% 15%,rgba(59,130,246,.15),transparent 35%),radial-gradient(circle at 85% 85%,rgba(16,185,129,.1),transparent 35%);pointer-events:none}

.wrap{width:min(900px,100%);margin-inline:auto;padding:24px 14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:14px}
.logo-box{width:48px;height:48px;border-radius:14px;flex:none;background:#111a2c;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 8px 20px -5px rgba(59,130,246,.4)}
.logo-box img{width:100%;height:100%;object-fit:cover;border-radius:13px}
h1{font-size:20px;font-weight:800}
.sub{font-size:12.5px;color:var(--muted)}

.card,.panel{background:var(--panel);backdrop-filter:blur(20px);border:1px solid var(--line);border-radius:var(--radius);box-shadow:0 4px 24px -8px rgba(0,0,0,.5);position:relative;overflow:hidden}
.panel{padding:22px}.card{padding:16px 18px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-bottom:20px}
.metric{font-size:22px;font-weight:800;margin-top:6px;color:#fff}
.card .lbl{font-size:12.5px;color:var(--muted);font-weight:600}

.btn{display:inline-flex;align-items:center;justify-content:center;padding:10px 16px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--text);font:inherit;font-weight:600;font-size:14px;cursor:pointer;transition:all .2s}
.btn:hover{background:rgba(255,255,255,.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:linear-gradient(135deg,#2563eb,#3b82f6);border:none;color:#fff}
.btn.success{background:linear-gradient(135deg,#059669,#10b981);border:none;color:#fff}
.btn.danger{background:linear-gradient(135deg,#dc2626,#ef4444);border:none;color:#fff}
.btn.w100{width:100%}

.field{display:flex;flex-direction:column;gap:6px;margin:14px 0}
.field label{color:var(--muted);font-size:13px;font-weight:600}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:var(--text);font:inherit;outline:none;transition:all .2s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(59,130,246,.2)}

.tabs{display:flex;gap:4px;background:rgba(0,0,0,.4);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:20px}
.tab{flex:1;text-align:center;padding:10px;border-radius:8px;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer}
.tab.on{background:var(--blue);color:#fff}

.result{white-space:pre-wrap;background:rgba(0,0,0,.4);border:1px solid var(--line);padding:14px;border-radius:12px;font-family:monospace;font-size:12px;height:300px;overflow-y:auto;color:#94a3b8}
.result .ok{color:#34d399}
.result .fail{color:#f87171}
.result .sys{color:#60a5fa}

.acc-box{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.03);padding:12px;border-radius:10px;margin-bottom:12px}
.acc-name{font-weight:700}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700}
.badge.ok{background:rgba(16,185,129,.15);color:#34d399}
.badge.err{background:rgba(239,68,68,.15);color:#f87171}

/* Admin Key List */
.key-item{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid var(--line);font-family:monospace;font-size:14px}
.key-item:last-child{border:none}
</style>
</head>
<body>

<div class="wrap hidden" id="loginView">
  <div class="panel" style="max-width:400px;margin:10vh auto;">
    <div class="brand" style="margin-bottom:24px;">
      <div class="logo-box"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp" onerror="this.outerHTML='<span>79</span>'"></div>
      <div><h1>LC79 Auto</h1><div class="sub">Hệ thống Đa người dùng</div></div>
    </div>
    <div class="tabs">
      <div class="tab on" id="tabUser">Người Dùng</div>
      <div class="tab" id="tabAdmin">Admin</div>
    </div>

    <!-- Form Khách -->
    <div id="formUser">
      <div class="field">
        <label>Nhập Key của bạn</label>
        <input id="inpKey" placeholder="VD: LC79-A1B2C3" autocomplete="off">
      </div>
      <button class="btn primary w100" onclick="loginUser()">Đăng nhập bằng Key</button>
    </div>

    <!-- Form Admin -->
    <div id="formAdmin" style="display:none;">
      <div class="field">
        <label>Mật khẩu Admin</label>
        <input id="inpAdminPass" type="password" placeholder="Nhập mật khẩu tạo Key">
      </div>
      <button class="btn w100" onclick="loginAdmin()">Vào trang Quản trị</button>
    </div>
  </div>
</div>

<!-- GIAO DIỆN USER -->
<div class="wrap hidden" id="userView">
  <div class="top">
    <div class="brand">
      <div class="logo-box"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp"></div>
      <div><h1>Bảng điều khiển</h1><div class="sub" id="txtUserKey">Key: ...</div></div>
    </div>
    <button class="btn danger" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="grid">
    <div class="card">
      <div class="lbl">Trạng thái Tool</div>
      <div class="metric" id="userActive">Đang tải...</div>
    </div>
    <div class="card">
      <div class="lbl">Code mới nhất</div>
      <div class="metric" id="userCode">—</div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <h2 style="font-size:16px;margin-bottom:16px;">Quản lý Tài khoản (Tối đa 1 acc)</h2>
    <div id="accContainer">
      <!-- Nếu có acc sẽ hiện ở đây -->
    </div>
    
    <div id="formAddAcc">
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <input id="accU" placeholder="Tên đăng nhập" style="flex:1;min-width:150px;">
        <input id="accP" type="password" placeholder="Mật khẩu" style="flex:1;min-width:150px;">
        <button class="btn primary" onclick="addAcc()">Lưu & Đăng nhập</button>
      </div>
      <div class="sub" style="margin-top:8px;">* Mỗi Key chỉ được treo 1 acc duy nhất để đảm bảo tốc độ.</div>
    </div>
  </div>

  <div class="panel">
    <h2 style="font-size:16px;margin-bottom:12px;">Nhật ký đổi mã</h2>
    <div class="result" id="userLogs"></div>
  </div>
</div>

<!-- GIAO DIỆN ADMIN -->
<div class="wrap hidden" id="adminView">
  <div class="top">
    <div class="brand">
      <div class="logo-box"><img src="https://lc79.games/assets/main/native/b6/b6241882-ec69-4e67-9c4e-ac4c1632c0d3.webp"></div>
      <div><h1>Trang Quản Trị</h1><div class="sub">Quản lý Key người dùng</div></div>
    </div>
    <button class="btn danger" onclick="logout()">Đăng xuất</button>
  </div>

  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
      <h2 style="font-size:16px;">Danh sách Key</h2>
      <button class="btn success" onclick="createKey()">+ Tạo Key mới</button>
    </div>
    <div id="adminKeyList"></div>
  </div>
</div>

<div id="toast" style="position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e293b;padding:12px 24px;border-radius:20px;font-weight:600;display:none;z-index:999"></div>

<script>
const $ = id => document.getElementById(id);
let myKey = '';
let isAdmin = false;
let refreshTimer = null;

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

// CHUYỂN TAB LOGIN
$('tabUser').onclick = () => { $('tabUser').classList.add('on'); $('tabAdmin').classList.remove('on'); $('formUser').style.display='block'; $('formAdmin').style.display='none'; };
$('tabAdmin').onclick = () => { $('tabAdmin').classList.add('on'); $('tabUser').classList.remove('on'); $('formAdmin').style.display='block'; $('formUser').style.display='none'; };

// API CALL
async function api(url, method = 'GET', body = null) {
  const headers = { 'x-api-key': isAdmin ? 'ADMIN' : myKey };
  if (body) headers['Content-Type'] = 'application/json';
  const r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : null });
  const j = await r.json().catch(()=>({ok:false, error:'Lỗi Server'}));
  if (!r.ok || !j.ok) throw new Error(j.error || 'Lỗi');
  return j;
}

// ĐĂNG NHẬP
async function loginUser() {
  const k = $('inpKey').value.trim().toUpperCase();
  if (!k) return toast('Nhập Key trước!');
  myKey = k;
  try {
    const res = await api('/api/user/state');
    showUser();
  } catch (e) {
    myKey = '';
    toast('Key không hợp lệ!');
  }
}

async function loginAdmin() {
  const p = $('inpAdminPass').value.trim();
  if (!p) return toast('Nhập mật khẩu Admin!');
  try {
    const res = await fetch('/api/admin/login', { method: 'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({password: p}) });
    if (!res.ok) throw new Error('Sai mật khẩu');
    isAdmin = true;
    showAdmin();
    loadAdminKeys();
  } catch (e) {
    toast('Sai mật khẩu Admin!');
  }
}

function logout() {
  myKey = ''; isAdmin = false;
  clearInterval(refreshTimer);
  $('loginView').classList.remove('hidden');
  $('userView').classList.add('hidden');
  $('adminView').classList.add('hidden');
}

function showUser() {
  $('loginView').classList.add('hidden');
  $('adminView').classList.add('hidden');
  $('userView').classList.remove('hidden');
  $('txtUserKey').textContent = 'Key: ' + myKey;
  refreshUser();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshUser, 2000);
}

async function refreshUser() {
  try {
    const res = await api('/api/user/state');
    const s = res.state;
    
    $('userActive').innerHTML = s.active ? '<span style="color:var(--green)">ĐANG BẬT</span>' : '<span style="color:var(--red)">ĐANG TẮT</span>';
    $('userCode').textContent = s.lastCode || '—';
    
    if (s.account) {
      $('formAddAcc').style.display = 'none';
      $('accContainer').innerHTML = `
        <div class="acc-box">
          <div>
            <div class="acc-name">${s.account.username}</div>
            <div class="sub" style="font-size:11px;color:${s.account.loggedIn ? 'var(--green)' : 'var(--red)'}">
              ${s.account.loggedIn ? 'Đã đăng nhập' : (s.account.error || 'Lỗi kết nối')}
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button class="btn ${s.active ? 'danger' : 'success'}" onclick="toggleTool()">${s.active ? 'TẮT TOOL' : 'BẬT TOOL'}</button>
            <button class="btn" onclick="delAcc()">Xóa</button>
          </div>
        </div>
      `;
    } else {
      $('accContainer').innerHTML = '';
      $('formAddAcc').style.display = 'block';
    }

    const logHtml = s.logs.map(l => {
      if (l.includes('[OK]')) return `<div class="ok">${l}</div>`;
      if (l.includes('[FAIL]')) return `<div class="fail">${l}</div>`;
      return `<div class="sys">${l}</div>`;
    }).join('');
    $('userLogs').innerHTML = logHtml || 'Chưa có log...';
  } catch (e) { console.log(e); }
}

async function addAcc() {
  const u = $('accU').value.trim();
  const p = $('accP').value.trim();
  if (!u || !p) return toast('Nhập đủ Tài khoản và Mật khẩu!');
  try {
    toast('Đang kiểm tra đăng nhập...');
    await api('/api/user/account', 'POST', { username: u, password: p });
    $('accU').value = ''; $('accP').value = '';
    refreshUser();
  } catch (e) { toast(e.message); }
}

async function delAcc() {
  if (!confirm('Xóa tài khoản này?')) return;
  await api('/api/user/account', 'DELETE');
  refreshUser();
}

async function toggleTool() {
  try {
    await api('/api/user/toggle', 'POST');
    refreshUser();
  } catch (e) { toast(e.message); }
}

// ADMIN FUNCTIONS
function showAdmin() {
  $('loginView').classList.add('hidden');
  $('userView').classList.add('hidden');
  $('adminView').classList.remove('hidden');
}

async function loadAdminKeys() {
  try {
    const res = await api('/api/admin/keys');
    const list = $('adminKeyList');
    list.innerHTML = '';
    if (res.keys.length === 0) list.innerHTML = '<div class="sub">Chưa có key nào.</div>';
    
    res.keys.forEach(k => {
      const div = document.createElement('div');
      div.className = 'key-item';
      div.innerHTML = `
        <div>
          <strong style="color:var(--blue);font-size:16px;">${k.key}</strong>
          ${k.hasAcc ? `<span style="margin-left:10px;font-size:12px;color:var(--muted)">(Acc: ${k.username} ${k.active ? '- Đang bật' : ''})</span>` : ''}
        </div>
        <button class="btn danger" style="padding:4px 8px;font-size:11px;" onclick="delKey('${k.key}')">Xóa</button>
      `;
      list.appendChild(div);
    });
  } catch (e) { toast(e.message); }
}

async function createKey() {
  try {
    const res = await api('/api/admin/keys', 'POST');
    toast('Đã tạo Key: ' + res.key);
    loadAdminKeys();
  } catch (e) { toast(e.message); }
}

async function delKey(k) {
  if (!confirm('Xóa Key ' + k + '?')) return;
  try {
    await api('/api/admin/keys/' + k, 'DELETE');
    loadAdminKeys();
  } catch (e) { toast(e.message); }
}
</script>
</body>
</html>
